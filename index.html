<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDA혁신연구실 콘테스트 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 시네마틱 블랙 무대. 위는 '폰 속 티저 + 행사 정보', 아래는 인스타그램식 3열 피드. 포인트 색은 티저의 RDA LAB 레드 하나. */
:root{
  --bg:#09090A;
  --panel:#141416;
  --panel-2:#1C1C1F;
  --line:#2A2A2E;
  --fg:#F3F1EE;
  --sub:#9C9893;
  --red:#E1262D;
  --red-deep:#9E1218;
  --gold:#E2B54A;
  --silver:#C9CDD3;
  --display-en:"Anton","Impact","Arial Narrow",sans-serif;
  --display-ko:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo b{font-family:var(--display-en);font-weight:400;font-size:20px;letter-spacing:.02em;background:var(--red);color:#fff;padding:2px 9px 1px;line-height:1.15}
.logo span{font-size:13px;color:var(--sub);font-weight:500}
.top nav{display:flex;gap:4px}
.top nav a{font-size:13px;text-decoration:none;color:var(--sub);padding:6px 10px;border-radius:999px}
.top nav a:hover{color:var(--fg);background:var(--panel)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(28px,6vw,72px);align-items:center;padding-block:clamp(32px,6vw,72px) clamp(40px,6vw,64px)}
.stage{position:relative;justify-self:center}
.stage::before{content:"";position:absolute;inset:8% -12% 0;background:radial-gradient(closest-side,color-mix(in srgb,var(--red) 38%,transparent),transparent 72%);filter:blur(30px);z-index:0;pointer-events:none}
.phone{position:relative;z-index:1;width:clamp(230px,26vw,300px);background:#000;border-radius:40px;padding:30px 10px;box-shadow:0 0 0 1.5px #2f2f33,0 0 0 4px #0d0d0f,0 30px 80px -20px rgba(0,0,0,.9)}
.phone::after{content:"";position:absolute;top:10px;left:50%;translate:-50% 0;width:26%;height:11px;background:#1b1b1e;border-radius:999px;z-index:3}
.phone .screen{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;display:flex;align-items:center}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.hctl{position:absolute;right:18px;bottom:44px;z-index:4;display:flex;gap:6px}
.pp{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;cursor:pointer;padding:0}
.pp svg{width:14px;height:14px;fill:currentColor}
.prog{position:absolute;left:10px;right:10px;bottom:30px;height:14px;z-index:4;cursor:pointer;display:flex;align-items:center}
.prog::before{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.prog i{position:absolute;left:8px;height:3px;border-radius:2px;background:var(--red);width:0}
.big-play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:4}
.big-play svg{width:30px;height:30px;fill:currentColor;margin-left:4px}
.snd{display:flex;align-items:center;gap:6px;border:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;cursor:pointer}
.snd svg{width:15px;height:15px}
.hero-like{position:absolute;left:18px;bottom:44px;z-index:4}

.info{min-width:0;container-type:inline-size}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--display-en);font-size:14px;letter-spacing:.14em;color:var(--sub)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.info h1{margin:14px 0 0;font-family:var(--display-ko);font-weight:400;font-size:min(8.6cqi,62px);line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.info h1 .yr{display:block;font-family:var(--display-en);font-size:min(10cqi,64px);letter-spacing:.04em;color:var(--red);line-height:1;margin-bottom:6px}
.tagline{margin:18px 0 0;font-family:var(--display-ko);font-size:clamp(20px,2.4vw,26px);color:var(--fg)}
.facts{margin:28px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;border-top:1px solid var(--line);padding-top:22px;max-width:480px}
.facts dt{font-family:var(--display-en);font-size:13px;letter-spacing:.14em;color:var(--sub);padding-top:3px}
.facts dd{margin:0;font-size:18px;font-weight:700}
.dday{margin-top:28px;display:flex;align-items:stretch;gap:0;max-width:480px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dday .big{background:var(--red);color:#fff;font-family:var(--display-en);font-size:clamp(44px,5.4vw,60px);line-height:1;padding:14px 20px 10px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.dday .clock{flex:1;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;text-align:center;background:var(--panel)}
.dday .clock div{font-family:var(--display-en);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.dday .clock small{display:block;margin-top:6px;font-family:var(--body);font-size:11px;color:var(--sub);letter-spacing:.06em}
.cta{margin-top:24px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;border-bottom:2px solid var(--red);padding-bottom:3px}

/* ---------- feed ---------- */
.sec{border-top:1px solid var(--line);padding-block:36px 8px;scroll-margin-top:64px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.sec-head .no{font-family:var(--display-en);font-size:14px;letter-spacing:.12em;color:var(--red)}
.sec-head h2{margin:0;font-family:var(--display-en);font-weight:400;font-size:clamp(30px,4.4vw,46px);letter-spacing:.02em;line-height:1}
.sec-head h2 span{font-family:var(--display-ko);font-size:.56em;letter-spacing:0;color:var(--fg);margin-left:10px;vertical-align:.18em}
.sec-head p{flex-basis:100%;margin:2px 0 0;color:var(--sub);font-size:14px}
.grid{margin:20px 0 0;display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:clamp(3px,.6vw,8px);list-style:none;padding:0}
@media (max-width:640px){.grid{grid-template-columns:repeat(var(--mcols,var(--cols,3)),1fr)}}
.finale{margin-top:40px;background:var(--red);color:#fff;border-radius:clamp(4px,.8vw,12px);padding:clamp(22px,4vw,44px);display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.finale b{font-family:var(--display-en);font-weight:400;font-size:clamp(36px,7vw,80px);line-height:.92}
.finale span{font-weight:700;font-size:clamp(14px,1.8vw,18px)}
.tile{container-type:inline-size;position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:var(--panel);border-radius:clamp(2px,.5vw,8px)}
.tile>button{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.tile>button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tile img.cover{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.tile:hover img.cover{transform:scale(1.04)}
.tile .kind{position:absolute;top:8px;right:8px;width:22px;height:22px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.tile .medal{position:absolute;top:6px;left:6px;width:clamp(30px,5vw,46px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.tile .dur{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums}
.tile .hover{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.15) 60%,transparent);opacity:0;transition:opacity .25s;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(10px,1.6vw,18px);gap:4px}
.tile:hover .hover,.tile>button:focus-visible .hover{opacity:1}
.hover .lab{font-size:12px;color:var(--sub);font-weight:500}
.hover .ttl{font-weight:700;font-size:clamp(13px,1.5vw,16px);line-height:1.35}
.hover .hc{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin-top:4px}
.hover .hc svg{width:15px;height:15px;color:var(--red)}
/* 미생물: 사진 바닥에 연구실 이름 */
.floor-label{position:absolute;left:0;right:0;bottom:0;padding:0 8% 6%;color:#121214;text-align:left}
.floor-label small{display:block;font-size:max(9px,4.6cqw);font-weight:700;letter-spacing:.04em;color:#7B6A3F}
.floor-label strong{display:block;font-family:var(--display-ko);font-weight:400;font-size:10.5cqw;white-space:nowrap;line-height:1.1}
/* 발표자료 타일 */
.tile.doc{background:linear-gradient(160deg,#1A1A1D,#101012)}
.doc-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:7cqw}
.doc-in .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display-en);font-size:max(9px,5.4cqw);letter-spacing:.14em;color:var(--sub)}
.doc-in img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;box-shadow:0 10px 30px -8px rgba(0,0,0,.8);transition:transform .4s}
.tile.doc:hover .doc-in img{transform:translateY(-3px)}
.doc-in .n{font-family:var(--display-ko);font-size:8.4cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-in .n small{display:block;overflow:hidden;text-overflow:ellipsis;font-family:var(--body);font-size:max(9px,4.6cqw);color:var(--sub);font-weight:500;margin-top:3px}
.tile.doc .medal{display:none}
/* coming soon */
.tile.soon{background:repeating-linear-gradient(135deg,#0F0F11 0 10px,#131316 10px 20px);border:1px dashed #34343a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:8px}
.soon .cs{font-family:var(--display-en);font-size:15cqw;line-height:.95;letter-spacing:.03em;color:#4a4a50}
.soon .cs b{display:block;color:var(--fg);font-weight:400}
.soon small{font-family:var(--display-en);font-size:max(8px,5cqw);letter-spacing:.18em;color:var(--red)}
/* 마지막 줄 채움 */
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--sub)}

footer{margin-top:72px;border-top:1px solid var(--line);padding-block:28px 40px;color:var(--sub);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

/* ---------- heart ---------- */
.heart{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:8px 14px 8px 12px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.heart svg{width:20px;height:20px;transition:transform .2s}
.heart[aria-pressed="true"]{border-color:color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 14%,var(--panel-2))}
.heart[aria-pressed="true"] svg{color:var(--red)}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.heart.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.hero-like .heart{background:rgba(0,0,0,.6);border-color:transparent;backdrop-filter:blur(6px);padding:6px 11px 6px 9px;font-size:12px;color:#fff}
.hero-like .heart svg{width:16px;height:16px}
.burst{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;color:#fff;pointer-events:none;animation:burst .8s ease forwards;z-index:5;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.burst path{fill:currentColor}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

/* ---------- viewer ---------- */
dialog.viewer{border:0;padding:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;background:rgba(5,5,6,.94);color:var(--fg)}
dialog.viewer::backdrop{background:transparent}
.v-shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;max-width:1320px;margin:0 auto}
.v-media{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(16px,3vw,40px)}
.v-side{border-left:1px solid var(--line);background:var(--panel);padding:56px 24px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.v-close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);cursor:pointer;display:grid;place-items:center}
.v-close svg{width:20px;height:20px}
.v-side .tagline-s{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:500}
.v-side .tagline-s svg{width:30px;height:auto;flex:none}
.v-side h3{margin:0;font-family:var(--display-ko);font-weight:400;font-size:24px;line-height:1.25;text-wrap:balance}
.v-side p{margin:0;color:#C9C5C0;font-size:14px}
.v-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.v-meta dt{color:var(--sub)}
.v-meta dd{margin:0;font-weight:500}
.v-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{border-color:#44444a}
.btn svg{width:16px;height:16px}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.v-links{display:flex;flex-direction:column;gap:8px}
.v-links:empty{display:none}

/* 영상 */
.v-phone{width:min(360px,calc((100vh - 140px) * 9 / 16 + 20px));background:#000;border-radius:40px;padding:30px 10px;box-shadow:0 0 0 1.5px #2f2f33,0 0 0 4px #0d0d0f,0 40px 100px -20px rgba(0,0,0,.9);position:relative}
.v-phone .screen{width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;display:flex;align-items:center}
.v-phone video{width:100%;height:100%;object-fit:contain;background:#000}
.v-land{width:100%;max-width:900px;position:relative}
.v-land video{width:100%;max-height:calc(100vh - 80px);border-radius:10px;background:#000;display:block}

/* 슬라이드/카드 */
.car{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;max-width:var(--mw,860px)}
.track::-webkit-scrollbar{display:none}
.track figure{margin:0;flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;position:relative}
.track img{max-width:100%;max-height:calc(100vh - 150px);aspect-ratio:var(--ratio);object-fit:contain;border-radius:6px;background:#111;display:block;user-select:none;-webkit-user-drag:none}
.car .nav{position:absolute;top:calc(50% - 30px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.car .nav:hover{background:rgba(255,255,255,.22)}
.car .nav svg{width:22px;height:22px}
.car .nav.prev{left:0}.car .nav.next{right:0}
.car .nav[disabled]{opacity:0;pointer-events:none}
.count{font-family:var(--display-en);font-size:15px;letter-spacing:.1em;color:var(--sub);font-variant-numeric:tabular-nums}
.count b{color:var(--fg);font-weight:400}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:320px}
.dots i{width:6px;height:6px;border-radius:50%;background:#3a3a40}
.dots i.on{background:var(--red)}
/* 포스터: 세로 스크롤 */
.tall{height:100%;overflow:auto;width:100%;max-width:620px;border-radius:8px}
.tall img{width:100%;display:block}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:0}
  .info{display:contents}
  .eyebrow{order:1}
  .info h1{order:2;font-size:7.4vw}
  .info h1 .yr{font-size:9vw}
  .stage{order:3;margin-top:28px}
  .facts{order:4}
  .dday{order:5}
  .cta{order:6;justify-self:start}
  .phone{width:min(270px,70vw)}
  .top nav{display:none}
  .v-shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:auto}
  .v-media{padding:56px 0 8px;height:72vh;min-height:0}
  .v-side{border-left:0;border-top:1px solid var(--line);padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow:visible}
  .v-phone{width:auto;height:100%;max-width:100%;aspect-ratio:9/16;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .v-land video{max-height:100%}
  .v-phone .screen{border-radius:8px;height:100%;aspect-ratio:auto}
  .car .nav{display:none}
  .track img{max-height:62vh}
}
@media (max-width:520px){
  .sec-head h2 span{display:block;margin:8px 0 0;font-size:20px}
  .hover{display:none!important}
  .tile .kind{width:16px;height:16px;top:5px;right:5px}
  .tile .dur{display:none}
  .facts dd{font-size:16px}
  .doc-in .n small{display:none}
}
</style>
</head><body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="맨 위로"><b>RDA LAB</b><span>2026 RDA혁신연구실 콘테스트</span></a>
    <nav aria-label="바로가기">
      <a href="#teasers">티저</a>
      <a href="#rewards">포상후기</a>
      <a href="#cases">우수사례</a>
      <a href="#slides">발표자료</a>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero" aria-label="행사 소개">
    <div class="stage">
      <div class="phone">
        <div class="screen" id="heroScreen">
          <video id="heroVideo" autoplay muted loop playsinline preload="metadata"></video>
        </div>
        <div class="hero-like" id="heroLike"></div>
        <button class="big-play" id="bigPlay" type="button" aria-label="재생" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <div class="prog" id="prog" role="slider" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="progBar"></i></div>
        <div class="hctl">
        <button class="pp" id="pp" type="button" aria-label="일시정지"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="ppIcon" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
        <button class="snd" id="snd" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="sndWave" d="m22 9-6 6m0-6 6 6"/></svg>
          <span id="sndTxt">소리 켜기</span>
        </button>
        </div>
      </div>
    </div>

    <div class="info">
      <div class="eyebrow"><i aria-hidden="true"></i>TEASER 01 — NOW SHOWING</div>
      <h1><span class="yr">2026</span>RDA혁신연구실 콘테스트</h1>
      <dl class="facts">
        <dt>DATE</dt><dd id="fDate"></dd>
        <dt>PLACE</dt><dd id="fPlace"></dd>
      </dl>
      <div class="dday" aria-live="off">
        <div class="big" id="dBig">D-00</div>
        <div class="clock">
          <div><span id="dH">00</span><small>시간</small></div>
          <div><span id="dM">00</span><small>분</small></div>
          <div><span id="dS">00</span><small>초</small></div>
        </div>
      </div>
      <a class="cta" href="#teasers">티저와 작년 수상 연구실 보기 ↓</a>
    </div>
  </section>

  <div id="sections"></div>
  <div class="finale"><b>SEE YOU<br>12.8</b><span id="finPlace"></span></div>
</main>

<footer>
  <div class="wrap">
    <span>농촌진흥청 연구정책국 연구정책과 연구제도팀</span>
    <span id="fFoot"></span>
  </div>
</footer>

<dialog class="viewer" id="viewer" aria-label="콘텐츠 보기">
  <button class="v-close" id="vClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="v-shell">
    <div class="v-media" id="vMedia"></div>
    <aside class="v-side" id="vSide"></aside>
  </div>
</dialog>

<script src="content.js"></script>
<script>
(() => {
  const S = window.SITE, HERO = window.HERO;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- icons ---------- */
  const ICON = {
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.5 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.5 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="7" width="13" height="13" rx="2" fill="currentColor"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>',
    poster: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2" fill="currentColor"/></svg>',
    slides: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="1.5" fill="currentColor"/><path d="M12 17v3M8 20h8"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
  };
  const medal = (m) => {
    if (!m) return "";
    const gold = m === "gold";
    const c1 = gold ? "#F6D77A" : "#EEF1F4", c2 = gold ? "#C8902A" : "#9DA3AB", txt = gold ? "최우수" : "우수";
    return `<svg class="medal" viewBox="0 0 60 70" role="img" aria-label="2025 ${txt} 연구실">
      <path d="M19 40 13 66l9-5 6 8 5-24z" fill="#B3171D"/><path d="M41 40l6 26-9-5-6 8-5-24z" fill="#8E1015"/>
      <circle cx="30" cy="28" r="23" fill="${c2}"/><circle cx="30" cy="28" r="19.5" fill="${c1}"/>
      <circle cx="30" cy="28" r="16.5" fill="none" stroke="${c2}" stroke-width="1.2" stroke-dasharray="2 2.2"/>
      <text x="30" y="${gold ? 32 : 33}" text-anchor="middle" font-family="Black Han Sans, Noto Sans KR, sans-serif" font-size="${gold ? 11 : 13}" fill="#3a2a08">${txt}</text>
    </svg>`;
  };

  /* ---------- hearts ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const liked = store.get("rdalab.liked", {});
  let counts = store.get("rdalab.counts", {});
  const heartEls = new Map(); // id -> Set of elements

  async function loadCounts() {
    if (!S.heartApi) return;
    try {
      const r = await fetch(S.heartApi, { cache: "no-store" });
      const j = await r.json();
      if (j && j.counts) { counts = j.counts; refreshHearts(); }
    } catch {}
  }
  function sendHeart(id, delta) {
    if (!S.heartApi) return;
    try {
      fetch(S.heartApi, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ id, delta }) }).catch(() => {});
    } catch {}
  }
  const countOf = id => Math.max(0, counts[id] || 0);
  function toggleHeart(id, force) {
    const on = force ?? !liked[id];
    if (!!liked[id] === on) return;
    if (on) liked[id] = 1; else delete liked[id];
    counts[id] = countOf(id) + (on ? 1 : -1);
    store.set("rdalab.liked", liked);
    if (!S.heartApi) store.set("rdalab.counts", counts);
    sendHeart(id, on ? 1 : -1);
    refreshHearts(id, true);
  }
  function heartBtn(id) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "heart"; b.dataset.id = id;
    b.addEventListener("click", e => { e.stopPropagation(); toggleHeart(id); });
    (heartEls.get(id) || heartEls.set(id, new Set()).get(id)).add(b);
    paintHeart(b);
    return b;
  }
  function paintHeart(b, pop) {
    const id = b.dataset.id, on = !!liked[id];
    b.setAttribute("aria-pressed", on);
    b.setAttribute("aria-label", on ? "좋아요 취소" : "좋아요");
    b.innerHTML = ICON.heart + `<span>${countOf(id).toLocaleString("ko-KR")}</span>`;
    if (pop) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  }
  function refreshHearts(onlyId, pop) {
    heartEls.forEach((set, id) => { if (onlyId && id !== onlyId) return; set.forEach(b => b.isConnected ? paintHeart(b, pop) : set.delete(b)); });
    document.querySelectorAll(".hc[data-id]").forEach(el => { if (!onlyId || el.dataset.id === onlyId) el.lastElementChild.textContent = countOf(el.dataset.id).toLocaleString("ko-KR"); });
  }
  function burst(host, id) {
    toggleHeart(id, true);
    const s = document.createElement("div");
    s.className = "burst"; s.innerHTML = ICON.heart;
    host.appendChild(s); setTimeout(() => s.remove(), 850);
  }

  /* ---------- hero ---------- */
  const hv = $("#heroVideo");
  hv.src = HERO.src; hv.poster = HERO.poster;
  $("#heroLike").appendChild(heartBtn(HERO.id));
  let heroWanted = true, clickT;
  const PAUSE_D = "M6 4h4v16H6zM14 4h4v16h-4z", PLAY_D = "M7 4.5v15l12.5-7.5z";
  function paintPP() {
    const paused = hv.paused;
    $("#ppIcon").setAttribute("d", paused ? PLAY_D : PAUSE_D);
    $("#pp").setAttribute("aria-label", paused ? "재생" : "일시정지");
    $("#bigPlay").hidden = !paused;
  }
  function toggleHero() {
    if (hv.paused) { heroWanted = true; hv.play().catch(() => {}); } else { heroWanted = false; hv.pause(); }
  }
  hv.addEventListener("play", paintPP); hv.addEventListener("pause", paintPP);
  hv.addEventListener("timeupdate", () => {
    const r = hv.duration ? hv.currentTime / hv.duration : 0;
    $("#progBar").style.width = `calc((100% - 16px) * ${r})`;
    $("#prog").setAttribute("aria-valuenow", Math.round(r * 100));
  });
  function seek(e) {
    const b = $("#prog").getBoundingClientRect(), x = (e.clientX - b.left - 8) / (b.width - 16);
    if (hv.duration) hv.currentTime = Math.max(0, Math.min(1, x)) * hv.duration;
  }
  $("#prog").addEventListener("click", seek);
  $("#prog").addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { hv.currentTime = Math.min(hv.duration || 0, hv.currentTime + 5); e.preventDefault(); }
    if (e.key === "ArrowLeft") { hv.currentTime = Math.max(0, hv.currentTime - 5); e.preventDefault(); }
  });
  $("#pp").addEventListener("click", toggleHero);
  $("#bigPlay").addEventListener("click", toggleHero);
  hv.addEventListener("click", () => { clearTimeout(clickT); clickT = setTimeout(toggleHero, 260); });
  $("#heroScreen").addEventListener("dblclick", () => { clearTimeout(clickT); burst($("#heroScreen"), HERO.id); });
  paintPP();
  $("#snd").addEventListener("click", () => {
    hv.muted = !hv.muted;
    if (!hv.muted) { hv.currentTime = 0; heroWanted = true; hv.play().catch(() => {}); }
    $("#snd").setAttribute("aria-pressed", !hv.muted);
    $("#sndTxt").textContent = hv.muted ? "소리 켜기" : "소리 끄기";
    $("#sndWave").setAttribute("d", hv.muted ? "m22 9-6 6m0-6 6 6" : "M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14");
  });
  $("#fDate").textContent = S.event.dateLabel;
  $("#fPlace").textContent = S.event.place;
  $("#fFoot").textContent = `${S.event.name} · ${S.event.dateLabel} · ${S.event.place}`;

  const target = new Date(S.event.date + "T00:00:00+09:00").getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const ms = target - Date.now();
    if (ms <= 0) { $("#dBig").textContent = Date.now() - target < 864e5 ? "D-DAY" : "THANK YOU"; ["#dH", "#dM", "#dS"].forEach(s => $(s).textContent = "00"); return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    $("#dBig").textContent = "D-" + d; $("#dH").textContent = pad(h); $("#dM").textContent = pad(m); $("#dS").textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);

  /* ---------- feed ---------- */
  const now = Date.now();
  const released = window.PROMOS.filter(p => !p.releaseAt || Date.parse(p.releaseAt) <= now)
    .sort((a, b) => Date.parse(b.releaseAt || 0) - Date.parse(a.releaseAt || 0))
    .map(p => ({ ...p, group: "promo" }));
  const upcoming = window.PROMOS.filter(p => p.releaseAt && Date.parse(p.releaseAt) > now)
    .sort((a, b) => Date.parse(a.releaseAt) - Date.parse(b.releaseAt));
  const soonCount = Math.max(0, S.promoSlots - released.length);
  const soon = Array.from({ length: soonCount }, (_, i) => ({ soon: true, group: "promo", at: upcoming[i]?.releaseAt }));
  const ITEMS = [...released, ...soon, ...window.ARCHIVE];
  const byId = Object.fromEntries(ITEMS.filter(i => i.id).map(i => [i.id, i]));

  const SECTIONS = [
    { id: "teasers", no: "01", en: "TEASERS", ko: "티저", desc: "새 티저는 맨 앞에 차례로 공개됩니다.", items: [...released, ...soon] },
    { id: "rewards", no: "02", en: "REWARDS", ko: "포상후기", desc: "2025 수상 연구실이 받은 포상, 이렇게 썼습니다.", items: window.ARCHIVE.filter(i => i.group === "award") },
    { id: "cases", no: "03", en: "BEST PRACTICES", ko: "2025 우수사례", desc: "키워드로 보는 RDA혁신연구실 — 콘테스트 진출 연구실의 운영 사례.", items: window.ARCHIVE.filter(i => i.group === "case") },
    { id: "slides", no: "04", en: "PRESENTATIONS", ko: "2025 수상팀 발표자료", desc: "본선 발표자료를 넘겨보고 PDF로 내려받을 수 있습니다.", items: window.ARCHIVE.filter(i => i.group === "slides") }
  ];
  const grid = null;
  function tile(it) {
    const li = document.createElement("li");
    if (it.soon) {
      li.className = "tile soon";
      const d = it.at ? new Date(it.at) : null;
      li.innerHTML = `<div class="cs">COMING<b>SOON</b></div><small>${d ? `${d.getMonth() + 1}.${d.getDate()} OPEN` : "NEXT TEASER"}</small>`;
      li.setAttribute("aria-label", "곧 공개될 홍보물");
      return li;
    }
    li.className = "tile" + (it.kind === "slides" ? " doc" : "");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", `${it.lab || it.tag || ""} ${it.title} 보기`);
    const sub = it.group === "promo" ? it.tag : (it.group === "case" ? "우수사례 모음" : `${it.lab}`);
    const hover = `<div class="hover"><span class="lab">${esc(sub)}</span><span class="ttl">${esc(it.group === "case" ? "키워드로 보는 RDA혁신연구실 · " + it.title : it.title)}</span><span class="hc" data-id="${it.id}">${ICON.heart}<span>${countOf(it.id).toLocaleString("ko-KR")}</span></span></div>`;
    if (it.kind === "slides") {
      btn.innerHTML = `<div class="doc-in"><span class="k">PRESENTATION · ${it.pages.length}P</span><img src="${it.pages[0]}" alt="" loading="lazy"><span class="n">${esc(it.lab)}<small>${esc(it.org)} · 2025 본선 발표</small></span></div>${hover}`;
    } else {
      const pos = it.kind === "poster" ? "object-position:top" : "";
      let extra = "";
      if (it.thumbStyle === "floor") extra = `<div class="floor-label"><small>2025 최우수 · ${esc(it.prize)}</small><strong>${esc(it.lab)}</strong></div>`;
      btn.innerHTML = `<img class="cover" src="${it.thumb || it.pages[0]}" alt="" loading="lazy" style="${pos}">${extra}
        <span class="kind">${ICON[it.kind]}</span>${it.duration ? `<span class="dur">${it.duration}</span>` : ""}${hover}`;
    }
    btn.addEventListener("click", () => openViewer(it.id));
    li.appendChild(btn);
    if (it.medal && it.kind !== "slides") li.insertAdjacentHTML("beforeend", medal(it.medal));
    return li;
  }
  function cols(n) { return n % 3 === 0 ? [3, 3] : n === 4 ? [4, 2] : n === 2 ? [2, 2] : n === 1 ? [3, 3] : [3, 3]; }
  function render() {
    const root = $("#sections"); root.innerHTML = "";
    SECTIONS.forEach(sec => {
      if (!sec.items.length) return;
      const el = document.createElement("section");
      el.className = "sec"; el.id = sec.id; el.setAttribute("aria-labelledby", sec.id + "-t");
      const [c, mc] = cols(sec.items.length);
      el.innerHTML = `<div class="sec-head"><span class="no">${sec.no}</span><h2 id="${sec.id}-t">${sec.en}<span>${esc(sec.ko)}</span></h2><p>${esc(sec.desc)}</p></div><ul class="grid" style="--cols:${c};--mcols:${mc}"></ul>`;
      const ul = el.querySelector("ul");
      sec.items.forEach(i => ul.appendChild(tile(i)));
      root.appendChild(el);
    });
    $("#finPlace").textContent = `${S.event.dateLabel} · ${S.event.place}`;
  }
  render();

  /* ---------- viewer ---------- */
  const dlg = $("#viewer"), vMedia = $("#vMedia"), vSide = $("#vSide");
  let cur = null, page = 0, track = null;

  function openViewer(id) {
    const it = byId[id]; if (!it) return;
    cur = it; page = 0; vMedia.innerHTML = ""; track = null;
    hv.pause();
    if (it.kind === "video") {
      const v = document.createElement("video");
      Object.assign(v, { src: it.src, poster: it.thumb, controls: true, playsInline: true, autoplay: true });
      let box;
      if (it.orient === "portrait") { box = document.createElement("div"); box.className = "v-phone"; box.innerHTML = '<div class="screen"></div>'; box.firstChild.appendChild(v); }
      else { box = document.createElement("div"); box.className = "v-land"; box.appendChild(v); }
      vMedia.appendChild(box);
    } else if (it.kind === "poster") {
      const d = document.createElement("div"); d.className = "tall";
      d.innerHTML = `<img src="${it.pages[0]}" alt="${esc(it.title)}">`;
      d.addEventListener("dblclick", () => burst(vMedia, it.id));
      vMedia.appendChild(d);
    } else {
      const car = document.createElement("div"); car.className = "car";
      const wide = it.ratio === "16 / 9";
      car.innerHTML = `<div class="track" style="--ratio:${it.ratio};--mw:${wide ? "1000px" : "min(720px, calc(100vh - 150px))"}">${it.pages.map((p, i) => `<figure><img src="${p}" alt="${esc(it.title)} ${i + 1}쪽" loading="${i < 2 ? "eager" : "lazy"}" draggable="false"></figure>`).join("")}</div>
        <button class="nav prev" type="button" aria-label="이전 장">${ICON.prev}</button><button class="nav next" type="button" aria-label="다음 장">${ICON.next}</button>
        <div class="count" aria-live="polite"><b id="pNow">1</b> / ${it.pages.length}</div>${it.pages.length <= 12 ? `<div class="dots">${it.pages.map(() => "<i></i>").join("")}</div>` : ""}`;
      vMedia.appendChild(car);
      track = car.querySelector(".track");
      car.querySelector(".prev").onclick = () => go(page - 1);
      car.querySelector(".next").onclick = () => go(page + 1);
      let t; track.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(() => { const p = Math.round(track.scrollLeft / track.clientWidth); if (p !== page) { page = p; paintPage(); } }, 60); });
      track.addEventListener("dblclick", () => burst(vMedia, it.id));
      paintPage();
    }
    if (it.kind === "video") vMedia.firstChild.addEventListener("dblclick", e => { if (e.target.tagName !== "VIDEO") burst(vMedia, it.id); });
    renderSide();
    if (!dlg.open) dlg.showModal();
  }
  function go(p) {
    if (!track) return;
    page = Math.max(0, Math.min(cur.pages.length - 1, p));
    track.scrollTo({ left: page * track.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    paintPage();
  }
  function paintPage() {
    const car = vMedia.querySelector(".car"); if (!car) return;
    car.querySelector("#pNow").textContent = page + 1;
    car.querySelector(".prev").disabled = page === 0;
    car.querySelector(".next").disabled = page === cur.pages.length - 1;
    car.querySelectorAll(".dots i").forEach((d, i) => d.classList.toggle("on", i === page));
    renderLinks();
  }
  function renderSide() {
    const it = cur;
    const head = it.group === "promo" ? `<span>${esc(it.tag)} · 2026 RDA혁신연구실 콘테스트</span>`
      : it.group === "case" ? `<span>2025 우수사례 모음 · ${esc(it.org)}</span>`
      : `${medal(it.medal).replace('class="medal"', "")}<span>2025 ${it.medal === "gold" ? "최우수" : "우수"} 연구실 · ${it.group === "slides" ? "본선 발표자료" : "포상 소개"}</span>`;
    const meta = it.group === "promo" ? "" : `<dl class="v-meta">
      ${it.lab && it.group !== "case" ? `<dt>연구실</dt><dd>${esc(it.org)} ${esc(it.lab)}</dd>` : ""}
      ${it.prize ? `<dt>포상</dt><dd>${esc(it.prize)}</dd>` : ""}
      ${it.pages ? `<dt>분량</dt><dd>${it.pages.length}${it.kind === "slides" ? "쪽" : "장"}</dd>` : ""}
      ${it.duration ? `<dt>길이</dt><dd>${it.duration}</dd>` : ""}</dl>`;
    vSide.innerHTML = `<div class="tagline-s">${head}</div>
      <h3>${esc(it.group === "case" ? "키워드로 보는 RDA혁신연구실 · " + it.title : it.title)}</h3>
      <p>${esc(it.desc)}</p>${meta}
      <div class="v-actions" id="vAct"></div>
      <div class="v-links" id="vLinks"></div>`;
    const act = $("#vAct", vSide);
    act.appendChild(heartBtn(it.id));
    if (it.pdf) act.insertAdjacentHTML("beforeend", `<a class="btn" href="${it.pdf}" download="${esc(it.lab)}_2025_발표자료.pdf">${ICON.dl}PDF 내려받기</a>`);
    renderLinks();
  }
  function renderLinks() {
    const box = $("#vLinks", vSide); if (!box) return;
    const ls = (cur.links && cur.links[page + 1]) || [];
    box.innerHTML = ls.map((l, i) => l.href
      ? `<a class="btn solid" href="${l.href}" target="_blank" rel="noopener">${ICON.ext}${esc(l.label)}</a>`
      : `<button class="btn solid" type="button" data-i="${i}">${esc(l.label)} →</button>`).join("");
    box.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
      const a = ls[+b.dataset.i].action;
      if (a && a.startsWith("goto:")) { closeViewer(); document.getElementById(a.slice(5))?.scrollIntoView(); }
    });
  }
  function closeViewer() { vMedia.querySelectorAll("video").forEach(v => v.pause()); vMedia.innerHTML = ""; if (dlg.open) dlg.close(); if (heroWanted) hv.play().catch(() => {}); }
  $("#vClose").onclick = closeViewer;
  dlg.addEventListener("cancel", e => { e.preventDefault(); closeViewer(); });
  dlg.addEventListener("click", e => { if (e.target === vMedia || e.target.classList.contains("car")) closeViewer(); });
  document.addEventListener("keydown", e => {
    if (!dlg.open || !track) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(page + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(page - 1); }
  });

  loadCounts();
})();
</script>
</body></html>
